[project]
name = "path-case-normalizer-tools"
version = "0.1.1"
description = "Detects path collisions on case-insensitive filesystems by normalizing path casing."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
